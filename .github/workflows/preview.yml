name: Preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check PR is current
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          if [[ "$current" == "open $PR_HEAD_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.pr.outputs.deploy == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.pr.outputs.deploy == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.pr.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.pr.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build preview
        if: steps.pr.outputs.deploy == 'true'
        env:
          PREVIEW_BUILD: "true"
        run: pnpm build:cloudflare
      - name: Deploy preview
        id: deployment
        if: steps.pr.outputs.deploy == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview.ndjson
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          : "${SITE_PASSWORD:?Set SITE_PASSWORD}"
          : "${SESSION_SECRET:?Set SESSION_SECRET}"
          [[ ${#SITE_PASSWORD} -ge 12 && ${#SESSION_SECRET} -ge 32 ]]
          preview_secrets="$RUNNER_TEMP/preview-secrets.json"
          trap 'rm -f "$preview_secrets"' EXIT
          umask 077
          jq -n '{SITE_PASSWORD: env.SITE_PASSWORD, SESSION_SECRET: env.SESSION_SECRET}' > "$preview_secrets"
          pnpm exec wrangler preview --config wrangler.jsonc --worker-name ctc-internal \
            --name "pr-$PR_NUMBER" --tag "$PR_HEAD_SHA" --ignore-base-config \
            --secrets-file "$preview_secrets"
          preview_url=$(jq -ser --arg preferred_url "https://pr-$PR_NUMBER.internal.ctcusc.com" '
            map(select(.type == "preview")) | last | .preview_urls // [] |
            (map(select(. == $preferred_url))[0] // .[0]) //
            error("No preview URL returned; enable Preview URLs on ctc-internal")
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          fallback_url=$(jq -sr '
            map(select(.type == "preview")) | last | .preview_urls // [] |
            map(select(endswith(".workers.dev")))[0] // empty
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "fallback_url=$fallback_url" >> "$GITHUB_OUTPUT"
          echo "[Preview for PR #$PR_NUMBER]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Update preview comment
        if: steps.pr.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deployment.outputs.url }}
          FALLBACK_URL: ${{ steps.deployment.outputs.fallback_url }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          [[ "$current" == "open $PR_HEAD_SHA" ]] || exit 0
          comment="$RUNNER_TEMP/preview-comment.md"
          {
            printf '<!-- ctc-preview -->\n\n### Preview deployment\n\n**[Open preview ↗](%s)**\n\n' "$PREVIEW_URL"
            printf '| Commit | Workflow |\n| --- | --- |\n'
            printf '| [`%s`](%s/%s/commit/%s) | [Run #%s · attempt %s](%s/%s/actions/runs/%s) |\n' \
              "${PR_HEAD_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_HEAD_SHA" \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ -n "$FALLBACK_URL" && "$FALLBACK_URL" != "$PREVIEW_URL" ]]; then
              printf '\n[Fallback preview](%s)\n' "$FALLBACK_URL"
            fi
          } > "$comment"
          payload="$RUNNER_TEMP/preview-comment.json"
          jq -n --rawfile body "$comment" '{body: $body}' > "$payload"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- ctc-preview -->"))) | .id' | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$payload" --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" --silent
          fi
