name: Preview cleanup
on:
  pull_request_target:
    types: [closed]
permissions: {}
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Delete preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          response="$RUNNER_TEMP/preview-cleanup.json"
          status=$(curl --silent --show-error --max-time 60 --output "$response" --write-out '%{http_code}' \
            --request DELETE --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/ctc-internal/previews/pr-$PR_NUMBER")
          if [[ "$status" == "404" ]]; then
            exit 0
          fi
          [[ "$status" == "200" ]] && jq -e '.success == true' "$response"
      - name: Retire GitHub deployments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          deployment_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=pr-$PR_NUMBER&per_page=100" --jq '.[].id')
          while read -r deployment_id; do
            [[ -n "$deployment_id" ]] || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state')
            [[ "$state" != "inactive" ]] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              -f state=inactive -f description="PR closed" -F auto_inactive=false --silent
          done <<< "$deployment_ids"
